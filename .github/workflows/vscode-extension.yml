name: VS Code extension
on:
  pull_request:
    paths: ['integrations/vscode/**', '.github/workflows/vscode-extension.yml']
  push:
    branches: [main]
    paths: ['integrations/vscode/**', '.github/workflows/vscode-extension.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'pydantic>=2,<3'
      - run: python scripts/check_backend.py
      - run: xvfb-run -a npm run test:host
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: openjarvis-coding-agent-vsix
          path: integrations/vscode/*.vsix
